[project]
name = "marketplace-extractor"
version = "0.1.0"
description = "Pasa productos de una tienda WooCommerce a Facebook Marketplace con ayuda de IA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pillow>=10",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.scripts]
marketplace = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
